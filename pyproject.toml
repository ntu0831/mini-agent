[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mini-agent"
dynamic = ["version"]
description = "A small, auditable ReAct agent runtime with tool calling, retries, tracing and tests."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MiniAgent contributors" }]
keywords = ["agent", "llm", "react", "tool-calling", "openai", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.32.0"]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
mini-agent = "mini_agent.cli:main"

[tool.hatch.version]
path = "src/mini_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]

[tool.pytest.ini_options]
addopts = "-q --cov=mini_agent --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["mini_agent"]
omit = ["src/mini_agent/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv"]
extend-exclude = ["README.md", "README.zh-CN.md", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "tavily",
    "tavily.*",
    "serpapi",
    "serpapi.*",
    "ddgs",
    "ddgs.*",
    "duckduckgo_search",
    "duckduckgo_search.*",
]
ignore_missing_imports = true
